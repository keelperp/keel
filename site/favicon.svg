<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Keel">
  <title>Keel</title>
  <rect width="32" height="32" rx="7" fill="#141414"/>
  <!-- the waterline, and the keel below it: the structure that keeps a hull upright
       without anyone holding it -->
  <path d="M5 13h22" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M8 13c1.6 6.4 4.4 10 8 10s6.4-3.6 8-10" fill="none" stroke="#e0894a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M16 13v10" stroke="#e0894a" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round"/>
</svg>
